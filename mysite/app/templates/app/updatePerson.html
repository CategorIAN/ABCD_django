{% extends "app/base.html" %}
<html lang="en">
{% block content %}
<form action="{% url 'app:updatePerson_get' %}" method="post">
    {% csrf_token %}
    <div class="container mt-5">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Name</th>
                    <th>Add Person?</th>
                    <th>Delete Person?</th>
                </tr>
            </thead>
            <tr>
                <td>{{  form.name }}</td>
                <td><input type="submit" name="add" value="Add Person"></td>
                <td><input type="submit" name="delete" value="Delete Person"></td>
            </tr>
        </table>
    </div>
</form>
{% endblock %}
</html>
