{% extends "app/base.html" %}
<html lang="en">
{% block content %}
<form action="{% url 'app:personalProfile_get' person %}" method="post">
    {% csrf_token %}
    <div class="container mt-5">
        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>Person</th>
                    <th>Select</th>
                </tr>
            </thead>
            <tr>
                <td>{{  person_form.name }}</td>
                <td><input type="submit" name="person" value="Select Person"></td>
            </tr>
        </table>
    </div>
</form>

    {{ data | safe }}

{% endblock %}
</html>
